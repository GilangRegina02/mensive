
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bear Anniversary</title>
<style>
body{margin:0;background:linear-gradient(#dff6ff,#fff5fb);overflow:hidden}
canvas{display:block}
#bubble{position:fixed;left:50%;top:18%;transform:translateX(-50%) scale(.8);max-width:420px;
background:#fff;border-radius:20px;padding:18px 22px;box-shadow:0 10px 30px rgba(0,0,0,.15);
font:18px/1.5 system-ui;opacity:0;transition:.35s;pointer-events:none}
#bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
</style></head><body>
<div id="bubble"></div>
<canvas id=c></canvas>
<script>
const msgs=[
"💖 Selamat mensive 2 bulan, sayang. Terima kasih sudah hadir dan membuat hari-hariku jauh lebih berwarna.",
"🐻 Dua bulan mungkin belum lama, tapi setiap momen bersamamu selalu terasa istimewa. Semoga kita terus tumbuh bersama.",
"🌸 Terima kasih sudah menjadi tempat pulang, tempat bercerita, dan alasan untuk tersenyum setiap hari.",
"✨ Aku berharap kita bisa melewati banyak mensive, anniversary, dan mimpi-mimpi indah bersama. ❤️",
"🤍 Semoga apa pun yang kita hadapi nanti, kita selalu memilih untuk saling menggenggam, bukan saling melepaskan."
];
const bubble=document.getElementById("bubble");
const cv=c,ctx=cv.getContext("2d");let w,h,mx=0,my=0,hearts=[];
function rs(){w=cv.width=innerWidth;h=cv.height=innerHeight;}onresize=rs;rs();
function speak(){bubble.textContent=msgs[Math.floor(Math.random()*msgs.length)];
bubble.classList.add("show");clearTimeout(bubble.t);bubble.t=setTimeout(()=>bubble.classList.remove("show"),4500);}
onclick=e=>{speak();for(let i=0;i<18;i++)hearts.push({x:e.clientX,y:e.clientY,vx:(Math.random()-.5)*2,vy:-2-Math.random()*2,a:1})}
onmousemove=e=>{mx=e.clientX;my=e.clientY}
function bear(x,y){ctx.save();ctx.translate(x,y);ctx.fillStyle="#b98963";
[[ -45,-55],[45,-55]].forEach(p=>{ctx.beginPath();ctx.arc(p[0],p[1],22,0,7);ctx.fill();});
ctx.beginPath();ctx.arc(0,0,70,0,7);ctx.fill();
let a=Math.atan2(my-y,mx-x);let ox=Math.cos(a)*3,oy=Math.sin(a)*3;
ctx.fillStyle="#222";[-20,20].forEach(dx=>{ctx.beginPath();ctx.ellipse(dx+ox,-10+oy,4,6,0,0,7);ctx.fill();});
ctx.fillStyle="#f6dfc9";ctx.beginPath();ctx.ellipse(0,18,26,18,0,0,7);ctx.fill();
ctx.fillStyle="#222";ctx.beginPath();ctx.ellipse(0,10,6,4,0,0,7);ctx.fill();
ctx.strokeStyle="#333";ctx.beginPath();ctx.arc(0,20,10,0,.9);ctx.stroke();
ctx.restore();}
function loop(){ctx.clearRect(0,0,w,h);bear(w/2,h/2);
hearts=hearts.filter(h=>h.a>0);hearts.forEach(o=>{o.x+=o.vx;o.y+=o.vy;o.a-=.015;ctx.globalAlpha=o.a;ctx.font="24px serif";ctx.fillText("💖",o.x,o.y)});ctx.globalAlpha=1;requestAnimationFrame(loop)}
loop();
</script></body></html>
